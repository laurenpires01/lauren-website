# ============================================================
# Lauren Pires — netlify.toml (Eleventy build)
# ============================================================
# NOTE: Do NOT add http→https or non-www→www redirects here.
# Netlify handles HTTPS automatically; the canonical www domain
# is set in the Netlify dashboard under Domain Settings.

[build]
  command = "npm install && npx @11ty/eleventy"
  publish = "_site"

# ---- Cache headers ----
# HTML: always revalidate. CSS/JS: 5 minutes, never a year —
# stylesheet links are version-stamped (?v=YYYYMMDD) so stale
# devices recover on the next deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---- Security headers ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ---- 301s: old /page.html URLs -> clean URLs ----
# force = true so nothing at the path can shadow the redirect.

[[redirects]]
  from   = "/about.html"
  to     = "/about"
  status = 301
  force  = true

