<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EY0YQH5DC2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-EY0YQH5DC2');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicons/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
  <link rel="manifest" href="/favicons/site.webmanifest">
  <meta name="theme-color" content="#10524F">
  <title>Thank You | Lauren Pires</title>
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="/styles.css?v=20260711">
</head>
<body>

  {% include "header.njk" %}

  <main>

  <section class="section" style="padding-top: 12rem; padding-bottom: 8rem; text-align: center;">
    <div class="container fade-in">
      <p class="section-label">Message Sent</p>
      <h1 class="section__title">Thank You!</h1>
      <p class="section__subtitle" style="margin-top: 1rem; max-width: 500px; margin-left: auto; margin-right: auto;">Your message has been received. Lauren will be in touch soon.</p>
      <a href="/" class="btn btn--primary" style="margin-top: 2rem;">Back to Home</a>
    </div>
  </section>

  </main>

  {% include "footer.njk" %}

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
    const toggle = document.querySelector('.nav__toggle');
    const navLinks = document.querySelector('.nav__links');
    if (toggle && navLinks) {
      toggle.addEventListener('click', () => { navLinks.classList.toggle('open'); toggle.classList.toggle('open'); });
      navLinks.querySelectorAll('a').forEach(link => { link.addEventListener('click', () => { navLinks.classList.remove('open'); toggle.classList.remove('open'); }); });
    }
  </script>
</body>
</html>
